          role: system
          text: "{{#context#}}\n\n公司官网 about / 价值观页文本：\n{{#1781018406513.company_website_text#}}\n\n# 任务：分析这家公司的企业价值观，并反推简历应对策略\n\n请严格按以下步骤执行，只依据给定文本，禁止推测：\n\n步骤 1【摘原文】从「公司官网文本」中摘出与价值观、文化、用人观直接相关的原句，逐条列出，并标注是原文原话。\n\n步骤 2【归纳标签】把步骤 1 的原句归纳成 3–5 个文化标签，每个标签一句话概括，并在其后附上步骤 1 里对应的官网原句作为佐证。\n\n步骤 3【映射能力】针对每个标签，反推「简历里应提供什么行为证据」才能对上该标签，给出具体可写的证据方向（例如某次协作方式、某段抗压经历）。\n\n步骤 4【给证据建议】综合以上，用一句话回答：这家公司会录用什么样的人。\n\n# 输出格式（严格遵守）\n① 文化标签（3–5 个，每个附一句官网原句佐证）\n② 每个标签对应的简历行为证据方向\n③ 一句话：「这家公司会录用 ______ 的人」\n\n# 关键约束\n- 若「公司官网文本」为空、或与价值观无关，直接输出「缺企业信息，建议补官网链接」，不要输出任何推测。"
