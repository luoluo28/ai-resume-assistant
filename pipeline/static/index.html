<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#4f46e5">
<title>AI简历助手</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         max-width: 720px; margin: 0 auto; padding: 16px; line-height: 1.6; color: #1f2937; }
  h1 { font-size: 20px; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  textarea, input[type=text], input[type=password] { width: 100%; box-sizing: border-box;
         padding: 8px; font-size: 15px; border: 1px solid #d1d5db; border-radius: 6px; }
  textarea { min-height: 90px; }
  input[type=file] { margin-top: 4px; }
  button { margin-top: 16px; padding: 10px 20px; font-size: 16px; border: none;
           border-radius: 8px; background: #4f46e5; color: #fff; cursor: pointer; }
  button.secondary { background: #6b7280; margin-left: 8px; }
  #progress { margin-top: 16px; color: #4f46e5; font-weight: 600; }
  .card { margin-top: 16px; padding: 14px; border: 1px solid #e5e7eb; border-radius: 10px; }
  .card h2 { font-size: 16px; margin: 0 0 8px; }
  .conclusion { font-size: 18px; font-weight: 700; }
  ol, ul { margin: 6px 0; padding-left: 20px; }
  #login { max-width: 360px; margin: 40px auto; }
</style>
</head>
<body>

<div id="login" hidden>
  <h1>需要口令</h1>
  <input id="pw" type="password" placeholder="访问口令">
  <button onclick="login()">进入</button>
</div>

<div id="app" hidden>
  <h1>AI简历助手</h1>

  <label>岗位名（可选，不给则从 JD 首行提取）</label>
  <input id="position" type="text" placeholder="例如：后端开发工程师">

  <label>JD：粘贴文本 或 选文件</label>
  <textarea id="jd_text" placeholder="把岗位描述粘贴到这里"></textarea>
  <input id="jd_file" type="file" accept=".txt,.md,.pdf,.png,.jpg,.jpeg">

  <label>简历：粘贴文本 或 选文件（手机上可直接选照片）</label>
  <textarea id="resume_text" placeholder="简历文本，或选文件"></textarea>
  <input id="resume_file" type="file" accept="image/*,.txt,.md,.pdf">

  <label>公司官网文本（可选）</label>
  <textarea id="company_text" placeholder="公司 about / 价值观页文本"></textarea>

  <button onclick="analyze()">开始分析</button>
  <div id="progress"></div>
  <div id="result"></div>
</div>

<script>
const STEP_NAMES = ["", "提取简历信息", "分析岗位需求", "分析企业价值观", "生成投递建议"];
let taskId = null;

async function login() {
  const fd = new FormData();
  fd.append("password", document.getElementById("pw").value);
  const r = await fetch("/api/login", { method: "POST", body: fd });
  if (r.ok) showApp();
  else alert("口令错误");
}
function showApp() { document.getElementById("login").hidden = true; document.getElementById("app").hidden = false; }

async function analyze() {
  const fd = new FormData();
  fd.append("position", document.getElementById("position").value);
  fd.append("jd_text", document.getElementById("jd_text").value);
  fd.append("resume_text", document.getElementById("resume_text").value);
  fd.append("company_text", document.getElementById("company_text").value);
  const jdFile = document.getElementById("jd_file").files[0];
  const resumeFile = document.getElementById("resume_file").files[0];
  if (jdFile) fd.append("jd_file", jdFile);
  if (resumeFile) fd.append("resume_file", resumeFile);

  document.getElementById("result").innerHTML = "";
  const r = await fetch("/api/analyze", { method: "POST", body: fd });
  if (r.status === 401) { document.getElementById("app").hidden = true; document.getElementById("login").hidden = false; return; }
  if (!r.ok) { alert("提交失败：" + (await r.text())); return; }
  const data = await r.json();
  taskId = data.task_id;
  poll();
}

async function poll() {
  while (true) {
    const r = await fetch("/api/task/" + taskId);
    const s = await r.json();
    document.getElementById("progress").textContent =
      "第 " + s.step + "/4 步：" + (STEP_NAMES[s.step] || "") + "（" + s.elapsed + "s）";
    if (s.status === "done") { await showResult(); break; }
    if (s.status === "error") { document.getElementById("progress").textContent = "出错：" + s.error; break; }
    await new Promise(res => setTimeout(res, 2000));
  }
}

async function showResult() {
  const r = await fetch("/api/task/" + taskId + "/result");
  const { advice, coverage } = await r.json();
  const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  let html = '<div class="card"><div class="conclusion">' + esc(advice.conclusion)
    + (advice.score ? "（匹配度 " + esc(advice.score) + "%）" : "") + "</div>"
    + "<p><b>岗位：</b>" + esc(advice.position) + "</p>"
    + "<h2>理由</h2><ol>" + (advice.reasons || []).map(x => "<li>" + esc(x) + "</li>").join("") + "</ol>"
    + "<h2>差什么</h2><ul>" + (advice.gaps || []).map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>"
    + "<h2>怎么补</h2><p>" + esc(advice.advice) + "</p>"
    + "<h2>打招呼第一句</h2><p>" + esc(advice.opening_line) + "</p>"
    + (advice.note ? "<p><small>" + esc(advice.note) + "</small></p>" : "")
    + '<button onclick="exportFile(\'xlsx\')">导出 Excel</button>'
    + '<button class="secondary" onclick="exportFile(\'pdf\')">导出 PDF</button></div>';
  if (coverage) {
    html += '<div class="card"><h2>关键词覆盖率 ' + esc(coverage.coverage) + "</h2>"
      + "<p><b>命中：</b>" + esc((coverage.matched || []).join("、")) + "</p>"
      + "<p><b>缺失：</b>" + esc((coverage.missing || []).join("、")) + "</p></div>";
  }
  document.getElementById("result").innerHTML = html;
}

async function exportFile(format) {
  const r = await fetch("/api/task/" + taskId + "/export?format=" + format, { method: "POST" });
  if (!r.ok) { alert("导出失败"); return; }
  const blob = await r.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "投递建议." + format;
  a.click();
}

// 启动时探一次是否需要口令
fetch("/api/task/__probe__").then(r => {
  if (r.status === 401) document.getElementById("login").hidden = false;
  else showApp();
}).catch(() => showApp());
</script>
</body>
</html>
