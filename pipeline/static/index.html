<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0f766e">
<title>AI简历助手</title>
<style>
  :root { --primary: #0f766e; --border: #e5e7eb; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         max-width: 720px; margin: 0 auto; padding: 16px; line-height: 1.6; color: #1f2937; }
  h1 { font-size: 20px; }
  #status { color: #6b7280; font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  textarea, input[type=text], input[type=password] { width: 100%; box-sizing: border-box;
         padding: 8px; font-size: 15px; border: 1px solid #d1d5db; border-radius: 6px; }
  textarea { min-height: 90px; }
  .pick-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .pick-btn { margin-top: 0; padding: 7px 14px; font-size: 14px; background: #fff;
              color: var(--primary); border: 1px solid var(--primary); border-radius: 8px;
              white-space: nowrap; flex: 0 0 auto; }
  .hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .picked { font-size: 13px; color: var(--primary); margin-top: 0; flex: 1 1 auto; min-width: 0; }
  button { margin-top: 16px; padding: 10px 20px; font-size: 16px; border: none;
           border-radius: 8px; background: var(--primary); color: #fff; cursor: pointer; }
  button.secondary { background: #6b7280; margin-left: 8px; }
  button:disabled { background: #9ca3af; cursor: default; }
  #progress { margin-top: 16px; color: var(--primary); font-weight: 600; }
  .card { margin-top: 16px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; }
  .card h2 { font-size: 16px; margin: 0 0 8px; }
  .card h3 { font-size: 15px; margin: 12px 0 4px; }
  .conclusion { font-size: 18px; font-weight: 700; }
  .dims { color: #374151; font-size: 14px; margin: 4px 0; }
  .locfail { color: #b91c1c; font-weight: 700; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 4px;
         background: #f3f4f6; color: #374151; margin-right: 4px; }
  .tag.have { background: #dcfce7; color: #166534; }
  .tag.partial { background: #fef3c7; color: #92400e; }
  .tag.none { background: #fee2e2; color: #991b1b; }
  .tag.self_confirm { background: #e0e7ff; color: #3730a3; }
  ol, ul { margin: 6px 0; padding-left: 18px; }
  .muted { color: #6b7280; font-size: 13px; }
  #login { max-width: 360px; margin: 40px auto; }
</style>
</head>
<body>

<div id="login" hidden>
  <h1>需要口令</h1>
  <p class="muted">启动脚本窗口里打印的那串数字就是口令</p>
  <input id="pw" type="password" placeholder="访问口令">
  <button onclick="login()">进入</button>
</div>

<div id="app" hidden>
  <h1>AI简历助手</h1>
  <div id="status"></div>

  <label>岗位名（可选，不给则从 JD 首行提取）</label>
  <input id="position" type="text" placeholder="例如：后端开发工程师">

  <label>JD：粘贴文本 或 选文件</label>
  <textarea id="jd_text" placeholder="把岗位描述粘贴到这里"></textarea>
  <div class="pick-row">
    <button type="button" class="pick-btn" onclick="pick('jd_file')">选择 JD 文件</button>
    <span class="picked" id="jd_picked">未选择</span>
  </div>
  <input id="jd_file" type="file" class="hidden-file" accept=".txt,.md,.pdf,.png,.jpg,.jpeg">

  <label>简历：粘贴文本 或 选文件（手机上可直接选照片）</label>
  <textarea id="resume_text" placeholder="简历文本，或选文件"></textarea>
  <div class="pick-row">
    <button type="button" class="pick-btn" onclick="pick('resume_file')">选择简历文件</button>
    <span class="picked" id="resume_picked">未选择</span>
  </div>
  <input id="resume_file" type="file" class="hidden-file" accept="image/*,.txt,.md,.pdf">

  <label>公司官网文本（可选，不填就跳过这一步、不花钱）</label>
  <textarea id="company_text" placeholder="公司 about / 价值观页文本"></textarea>

  <button id="btn_analyze" onclick="analyze()">开始分析</button>
  <div id="progress"></div>
  <div id="result"></div>
</div>

<script>
const STEP_NAMES = ["", "提取简历信息", "分析岗位需求", "企业价值观（无文本则跳过）", "生成投递建议"];
let taskId = null;
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function dimsText(scores) {
  const labels = { technical: "技术", experience: "经验", behavioral: "软实力", career: "职业" };
  if (!scores) return "";
  return Object.entries(labels).map(([k, v]) => v + " " + (scores[k] ?? "?")).join(" · ");
}

async function apiError(r, fallback) {
  try {
    const j = await r.json();
    return j.detail || fallback;
  } catch (e) {
    return fallback;
  }
}

function pick(inputId) {
  document.getElementById(inputId).click();
}

function bindPick(inputId, labelId, textareaId) {
  document.getElementById(inputId).addEventListener("change", ev => {
    const f = ev.target.files[0];
    const lab = document.getElementById(labelId);
    const ta = textareaId ? document.getElementById(textareaId) : null;
    if (!f) { lab.textContent = "未选择"; return; }
    lab.textContent = "已选择：" + f.name;
    // 纯文本文件直接读进输入框，避免"选完文件输入框还是空的"
    if (ta && /\.(txt|md)$/i.test(f.name)) {
      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result || "").trim();
        if (text) { ta.value = text; lab.textContent = "已选择：" + f.name + "（内容已填入上方框）"; }
      };
      reader.readAsText(f, "UTF-8");
    }
  });
}

async function loadStatus() {
  try {
    const r = await fetch("/api/status");
    if (!r.ok) return;
    const s = await r.json();
    document.getElementById("status").textContent =
      "上次岗位：" + (s.position || "无") + " ｜ 上次运行：" + (s.last_run || "无");
  } catch (e) {}
}

async function login() {
  const fd = new FormData();
  fd.append("password", document.getElementById("pw").value);
  const r = await fetch("/api/login", { method: "POST", body: fd });
  if (r.ok) { showApp(); loadStatus(); }
  else { alert(await apiError(r, "口令错误")); }
}

function showApp() {
  document.getElementById("login").hidden = true;
  document.getElementById("app").hidden = false;
}

function showLogin() {
  document.getElementById("app").hidden = true;
  document.getElementById("login").hidden = false;
}

async function analyze() {
  const fd = new FormData();
  fd.append("position", document.getElementById("position").value);
  fd.append("jd_text", document.getElementById("jd_text").value);
  fd.append("resume_text", document.getElementById("resume_text").value);
  fd.append("company_text", document.getElementById("company_text").value);
  const jdFile = document.getElementById("jd_file").files[0];
  const resumeFile = document.getElementById("resume_file").files[0];
  if (jdFile) fd.append("jd_file", jdFile);
  if (resumeFile) fd.append("resume_file", resumeFile);

  const btn = document.getElementById("btn_analyze");
  btn.disabled = true;
  document.getElementById("result").innerHTML = "";
  try {
    const r = await fetch("/api/analyze", { method: "POST", body: fd });
    if (r.status === 401) { showLogin(); return; }
    if (!r.ok) { alert(await apiError(r, "提交失败")); return; }
    const data = await r.json();
    taskId = data.task_id;
    await poll();
  } finally {
    btn.disabled = false;
  }
}

async function poll() {
  while (true) {
    const r = await fetch("/api/task/" + taskId);
    if (r.status === 401) { showLogin(); return; }
    if (!r.ok) { document.getElementById("progress").textContent = await apiError(r, "任务查不到"); return; }
    const s = await r.json();
    document.getElementById("progress").textContent =
      "第 " + s.step + "/4 步：" + (STEP_NAMES[s.step] || "") + "（" + s.elapsed + "s）";
    if (s.status === "done") { document.getElementById("progress").textContent = "分析完成"; await showResult(); return; }
    if (s.status === "error") {
      document.getElementById("progress").textContent = "出错：" + (s.error || "未知错误");
      return;
    }
    await new Promise(res => setTimeout(res, 800));
  }
}

async function showResult() {
  const r = await fetch("/api/task/" + taskId + "/result");
  if (!r.ok) { alert(await apiError(r, "结果还没准备好")); return; }
  const { advice, coverage } = await r.json();
  const locFail = advice.location_verdict === "FAIL"
    ? '<span class="locfail"> 地点 FAIL，已一票否决</span>' : "";
  let html = '<div class="card"><div class="conclusion">' + esc(advice.conclusion)
    + (advice.score ? "（匹配度 " + esc(advice.score) + "%）" : "") + locFail + "</div>"
    + "<p><b>岗位：</b>" + esc(advice.position) + "</p>"
    + "<p><b>分档：</b>" + esc(advice.verdict) + "  <b>地点：</b>" + esc(advice.location_verdict) + "</p>"
    + '<p class="dims"><b>四维：</b>' + dimsText(advice.scores) + "</p>"
    + "<h2>理由</h2><ol>" + (advice.reasons || []).map(x => "<li>" + esc(x) + "</li>").join("") + "</ol>"
    + "<h2>差什么</h2><ul>" + (advice.gaps || []).map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>"
    + "<h2>怎么补</h2><p>" + esc(advice.advice) + "</p>"
    + "<h2>打招呼第一句</h2><p>" + esc(advice.opening_line) + "</p>"
    + (advice.note ? "<p><small>" + esc(advice.note) + "</small></p>" : "")
    + '<button onclick="exportFile(\'xlsx\')">导出 Excel</button>'
    + '<button class="secondary" onclick="exportFile(\'pdf\')">导出 PDF</button></div>';
  if (coverage) {
    html += '<div class="card"><h2>关键词覆盖率 ' + esc(coverage.coverage) + "</h2>"
      + "<p><b>命中：</b>" + esc((coverage.matched || []).join("、")) + "</p>"
      + "<p><b>缺失：</b>" + esc((coverage.missing || []).join("、")) + "</p></div>";
  }
  html += '<div class="card"><h2>下一步：简历顾问</h2>'
    + '<p class="muted">对标 JD 改简历、排项目、生成面试追问树。只多花 1 次调用，同样的输入第二次不重复花钱。</p>'
    + '<button id="btn_advisor" onclick="runAdvisor()">生成简历顾问</button>'
    + '<div id="advisor_out"></div></div>';
  document.getElementById("result").innerHTML = html;
  loadStatus();
}

async function runAdvisor() {
  const btn = document.getElementById("btn_advisor");
  const out = document.getElementById("advisor_out");
  btn.disabled = true;
  out.innerHTML = '<p class="muted">正在生成，通常 20–40 秒…</p>';
  try {
    const r = await fetch("/api/task/" + taskId + "/advisor", { method: "POST" });
    if (r.status === 401) { showLogin(); return; }
    if (!r.ok) { out.innerHTML = '<p class="locfail">' + esc(await apiError(r, "生成失败")) + "</p>"; return; }
    const { advisor } = await r.json();
    out.innerHTML = renderAdvisor(advisor);
  } finally {
    btn.disabled = false;
  }
}

function renderAdvisor(a) {
  const verdictTag = v => '<span class="tag ' + esc(v) + '">' + esc(v) + "</span>";
  let h = "";

  if ((a.alignments || []).length) {
    h += "<h3>逐条对齐 JD</h3><ul>";
    a.alignments.forEach(x => {
      h += "<li>" + verdictTag(x.verdict) + esc(x.jd_item)
        + (x.evidence ? '<div class="muted">证据：' + esc(x.evidence) + "</div>" : "");
    });
    h += "</ul>";
  }

  if ((a.project_blocks || []).length) {
    h += "<h3>项目块（可直接改进简历）</h3>";
    a.project_blocks.forEach(b => {
      h += '<div class="card"><b>' + esc(b.name || b.project) + "</b>";
      [["one_liner", "做什么"], ["role", "我的角色"], ["decision", "关键决策"],
       ["implementation", "关键实现"], ["deliverable", "交付物"]].forEach(([k, label]) => {
        if (b[k]) h += "<div><b>" + label + "：</b>" + esc(b[k]) + "</div>";
      });
      h += "</div>";
    });
  }

  if ((a.rewrites || []).length) {
    h += "<h3>改写对照</h3>";
    a.rewrites.forEach(r => {
      h += "<div><b>原句：</b>" + esc(r.before) + "<br><b>改后：</b>" + esc(r.after)
        + (r.risk ? '<div class="muted">可能追问：' + esc(r.risk) + "</div>" : "") + "</div>";
    });
  }

  if ((a.evidence_plan || []).length) {
    h += "<h3>一周内能补的证据</h3><ul>";
    a.evidence_plan.forEach(e => {
      h += "<li><b>缺：</b>" + esc(e.gap) + "<br>交付：" + esc(e.deliverable)
        + (e.acceptance ? "<br>验收：" + esc(e.acceptance) : "")
        + (e.resume_line ? '<br><span class="muted">补完可写：' + esc(e.resume_line) + "</span>" : "") + "</li>";
    });
    h += "</ul>";
  }

  if ((a.interview_probe || []).length) {
    h += "<h3>面试拷问自检</h3><ul>";
    a.interview_probe.forEach(p => {
      h += "<li>" + verdictTag(p.can_answer === "yes" ? "have" : p.can_answer === "partial" ? "partial" : "none")
        + "<b>" + esc(p.keyword) + "：</b>" + esc(p.question)
        + (p.advice ? '<div class="muted">' + esc(p.advice) + "</div>" : "") + "</li>";
    });
    h += "</ul>";
  }

  const tree = a.interview_tree;
  if (tree) {
    const items = Array.isArray(tree) ? tree : [tree];
    h += "<h3>追问树</h3>";
    items.forEach(t => {
      if (!t || typeof t !== "object") return;
      h += "<div><b>" + esc(t.project) + "</b>";
      (t.layers || []).forEach(l => {
        if (!l || typeof l !== "object") return;
        h += '<div style="margin-left:' + ((Number(l.level) || 1) - 1) * 12 + 'px">'
          + "<b>L" + esc(l.level) + "：</b>" + esc(l.question)
          + (l.readiness ? ' <span class="muted">（' + esc(l.readiness) + "）</span>" : "")
          + "<ul>" + (l.answer_points || []).map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
      });
      h += "</div>";
    });
  }

  if ((a.hooks || []).length) {
    h += "<h3>可埋的钩子</h3><ul>";
    a.hooks.forEach(x => {
      h += "<li><b>简历里写：</b>" + esc(x.resume_line)
        + '<div class="muted">会引出：' + esc(x.expected_question)
        + (x.must_be_true_fact ? "（依据事实：" + esc(x.must_be_true_fact) + "）" : "") + "</div></li>";
    });
    h += "</ul>";
  }

  if ((a.missing_material || []).length) {
    h += "<h3>补料清单</h3><ul>";
    a.missing_material.forEach(m => {
      h += "<li>" + esc(m.project) + "｜" + esc(m.item) + '<div class="muted">' + esc(m.why) + "</div></li>";
    });
    h += "</ul>";
  }

  const g = a._guard || {};
  if (g.dropped_count) {
    h += '<p class="muted">合规闸门拦掉了 ' + g.dropped_count + " 条没有原文依据的内容（防止编造）。</p>";
  }
  h += '<p><button class="secondary" onclick="exportFile(\'md\',\'简历顾问.md\')">下载简历顾问 Markdown</button></p>';
  return h;
}

async function exportFile(format, filename) {
  const r = await fetch("/api/task/" + taskId + "/export?format=" + format, { method: "POST" });
  if (!r.ok) { alert(await apiError(r, "导出失败")); return; }
  const blob = await r.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename || ("投递建议." + format);
  a.click();
}

bindPick("jd_file", "jd_picked", "jd_text");
bindPick("resume_file", "resume_picked", "resume_text");

// 启动时问一次真正存在的接口，决定显示登录页还是主界面
fetch("/api/auth").then(r => r.json()).then(s => {
  if (s.password_required && !s.logged_in) showLogin();
  else { showApp(); loadStatus(); }
}).catch(() => { showApp(); loadStatus(); });
</script>
</body>
</html>
